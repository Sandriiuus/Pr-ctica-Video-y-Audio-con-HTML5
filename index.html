<!DOCTYPE html>
<html lang="es">
<head>
    <!-- 4. Etiquetas Meta principales (las 12 de la lista) -->
    <meta charset="UTF-8">
    <meta name="description" content="Descripción del contenido">
    <meta name="keywords" content="palabras, clave, separadas, por, comas">
    <meta name="author" content="Nombre del autor">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="30">
    <meta name="robots" content="index, follow">
    <meta property="og:title" content="Título para redes sociales">
    <meta property="og:description" content="Descripción para redes sociales">
    <meta property="og:image" content="URL de la imagen">
    <meta name="theme-color" content="#ffffff">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">

    <title>Práctica Video y Audio con HTML5</title>

    <!-- 2. Favicon -->
    <link rel="icon" href="imagen/favicon-32x32.jpg" sizes="32x32" type="image/jpeg">
</head>
<body>

    <header>
        <h1>Manejo de video en HTML5</h1>
        <h2>Video</h2>
        <video controls="" autoplay="" loop="" width="600" height="400">
            <source src="video/video.mp4" type="video/mp4">
            <source src="video/video.webm" type="video/webm">
            <source src="video/video.ogv" type="video/ogg">
        </video>
    </header>

    <header>
        <h1>Manejo de Audio en HTML5</h1>
        <h2>Audio</h2>
        <audio controls="" autoplay="" style="width: 500px;">
            <source src="audio/audio.mp3" type="audio/mpeg">
            <source src="audio/audio.m4a" type="audio/mp4">
            <source src="audio/audio.ogg" type="audio/ogg">
        </audio>
    </header>

    <h1>Periódicos del día</h1>
    <div>
        <iframe src="http://www.marca.com" height="400" frameborder="0"></iframe>
    </div>
    <div>
        <iframe src="http://www.elmundo.es" height="400" frameborder="0"></iframe>
    </div>

    <h1>Video del Ies Juan bosco</h1>
    <div>
        <iframe width="560" height="315" src="https://www.youtube.com/embed/eKabc74IU7o" title="YouTube video player" frameborder="0" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
    </div>

    <br>

    <div>
        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3083.442383781076!2d-3.224483325184358!3d39.391496571622724!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xd69af036cec6af9%3A0x3cb32e283081ecee!2sIES%20Juan%20Bosco!5e0!3m2!1ses!2ses!4v1761657186043!5m2!1ses!2ses" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
    </div>

</body>
</html>
